<!doctype html><html lang="en"><head><base target="_top"><script async src="https://www.googletagmanager.com/gtag/js?id=G-5FVGG4CV77"></script><script>function gtag(){dataLayer.push(arguments)}window.dataLayer=window.dataLayer||[],gtag("js",new Date),gtag("config","G-5FVGG4CV77")</script><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/favicon.ico?v=20260421" sizes="any"><title>Blurred Mosaic - Abstract Mesh</title><style>@import url(https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap);body,html{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background-color:#000;font-family:'JetBrains Mono',monospace;color:#fff}canvas{display:block;width:100vw;height:100vh;position:absolute;top:0;left:0;z-index:1}#info-panel{position:absolute;left:5%;top:10%;width:280px;pointer-events:none;z-index:10;text-shadow:0 0 10px rgba(0,0,0,.8)}#info-panel h1{font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:24px;color:#fff}#info-panel p{font-size:12px;line-height:1.6;color:rgba(255,255,255,.9);margin-bottom:16px}#info-panel .footer{margin-top:32px;font-size:10px;color:rgba(255,255,255,.7);text-transform:lowercase}#control-panel{margin-top:30px;width:100%;pointer-events:auto}.control-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.control-row label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;width:60px;color:rgba(255,255,255,.8)}select{width:140px;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.3);color:#fff;font-family:'JetBrains Mono',monospace;font-size:10px;padding:6px 10px;border-radius:4px;outline:0;text-transform:uppercase}@media (max-width:900px){#info-panel{top:20px;left:20px}}</style></head><body><div id="info-panel"><h1>Blurred Mosaic</h1><p>Abstract Gradient Mesh<br>built with Shaders.</p><p>A low-res neon grid smoothed<br>into an aggressive liquid blur.</p><div class="footer">p5.js + WebGL</div><div id="control-panel"><div class="control-row"><label>Theme</label> <select id="ctrl-theme"><option value="0">NEON POP</option><option value="1" selected="selected">CYBERPUNK</option><option value="2">SUNSET</option><option value="3">OCEAN</option></select></div><div class="control-row"><label>Grid</label> <select id="ctrl-grid"><option value="0">MEDIUM</option><option value="1">FINE</option><option value="2" selected="selected">COARSE</option></select></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script><script>const vertShader="\nattribute vec3 aPosition;\nattribute vec2 aTexCoord;\n\nuniform mat4 uProjectionMatrix;\nuniform mat4 uModelViewMatrix;\n\nvarying vec2 vTexCoord;\n\nvoid main() {\n    vTexCoord = aTexCoord;\n    gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0);\n}\n",fragShader="\n#ifdef GL_ES\nprecision highp float;\n#endif\n\nvarying vec2 vTexCoord;\n\nuniform vec2 u_resolution;\nuniform float u_time;\nuniform vec2 u_mouse;\nuniform float u_theme;\nuniform vec2 u_gridSize;\n\n// Random function based on UV\nfloat random(vec2 st) {\n    return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123);\n}\n\n// 2D Noise\nfloat noise(vec2 st) {\n    vec2 i = floor(st);\n    vec2 f = fract(st);\n\n    float a = random(i);\n    float b = random(i + vec2(1.0, 0.0));\n    float c = random(i + vec2(0.0, 1.0));\n    float d = random(i + vec2(1.0, 1.0));\n\n    vec2 u = f*f*(3.0-2.0*f);\n\n    return mix(a, b, u.x) + \n           (c - a)* u.y * (1.0 - u.x) + \n           (d - b) * u.x * u.y;\n}\n\n// Function to get structured palette color based on selected theme\n// Tone-in-Tone style (consistent brightness/saturation, varying hues)\nvec3 getPalette(float v) {\n    v = clamp(v, 0.0, 1.0);\n    \n    vec3 c1, c2, c3, c4;\n    \n    if (u_theme < 0.5) {\n        // 0: NEON TONE-IN-TONE (High Saturation, High Brightness)\n        c1 = vec3(0.9, 0.4, 0.6); // Softer Pink/Magenta\n        c2 = vec3(0.2, 0.8, 1.0); // Bright Cyan\n        c3 = vec3(0.8, 1.0, 0.2); // Lime Green\n        c4 = vec3(1.0, 0.7, 0.1); // Bright Orange\n    } else if (u_theme < 1.5) {\n        // 1: DEEP CYBER (High Saturation, Mod Brightness)\n        c1 = vec3(0.5, 0.0, 0.8); // Deep Purple\n        c2 = vec3(0.8, 0.0, 0.5); // Deep Magenta\n        c3 = vec3(0.0, 0.6, 0.8); // Deep Teal\n        c4 = vec3(0.1, 0.3, 0.9); // Deep Blue\n    } else if (u_theme < 2.5) {\n        // 2: PASTEL SUNSET (Based on provided image hexes, with Pink swapped for Orange)\n        // RGB values calculated from hex: Orange, #F28D8D, #F29F8D, #62D9C3\n        c1 = vec3(0.949, 0.600, 0.322); // Orange instead of Pink\n        c2 = vec3(0.949, 0.553, 0.553); // #F28D8D (Coral Pink)\n        c3 = vec3(0.949, 0.624, 0.553); // #F29F8D (Peach)\n        c4 = vec3(0.384, 0.851, 0.765); // #62D9C3 (Mint/Teal)\n    } else {\n        // 3: MID OCEAN (Mid Saturation, Mid Brightness)\n        c1 = vec3(0.2, 0.6, 0.6); // Mid Teal\n        c2 = vec3(0.2, 0.5, 0.8); // Mid Blue\n        c3 = vec3(0.3, 0.7, 0.5); // Mid Green\n        c4 = vec3(0.4, 0.4, 0.8); // Mid Indigo\n    }\n\n    if (v < 0.33) return mix(c1, c2, smoothstep(0.0, 0.33, v));\n    if (v < 0.66) return mix(c2, c3, smoothstep(0.33, 0.66, v));\n    return mix(c3, c4, smoothstep(0.66, 1.0, v));\n}\n\n// Get the grid color at a specific coordinate\nvec3 getGridColor(vec2 coord) {\n    // Generate a noise value for this specific grid cell over time\n    float n = noise(coord * 0.5 + vec2(u_time * 0.1, u_time * 0.15));\n    // Additional offset for more distinct blocks\n    n = fract(n * 3.0); \n    return getPalette(n);\n}\n\nvoid main() {\n    vec2 uv = vTexCoord;\n    \n    // Grid Setup dynamically updated from UI\n    float gridX = u_gridSize.x;\n    float gridY = u_gridSize.y;\n    \n    // Fluidly change sizes (X only) based on time\n    // SLOWED DOWN: speed from 1.5 -> 0.5, magnitude 0.15 -> 0.08\n    float xWarp = sin(uv.x * 3.0 + u_time * 0.5) * 0.08;\n    \n    // Mouse Interaction\n    vec2 mouse = u_mouse;\n    float distToMouse = distance(vec2(uv.x, 1.0-uv.y), mouse);\n    float mouseEffect = smoothstep(0.4, 0.0, distToMouse);\n    \n    // Push the UV coordinates away horizontally based on mouse proximity\n    float mouseWarp = (uv.x - mouse.x) * mouseEffect * 0.5;\n    \n    vec2 gridUv = vec2((uv.x + xWarp + mouseWarp) * gridX, uv.y * gridY);\n    \n    // To make RECTANGLES visibly distinct, we sharpen the transition\n    vec2 i = floor(gridUv);\n    vec2 f = fract(gridUv);\n    \n    // Instead of f*f*(3-2f) which completely blurs, we clamp the fraction in the center\n    // and only blur near the edges (0.3 to 0.7 for a soft block look)\n    vec2 u = smoothstep(0.2, 0.8, f);\n    \n    vec3 c00 = getGridColor(i);\n    vec3 c10 = getGridColor(i + vec2(1.0, 0.0));\n    vec3 c01 = getGridColor(i + vec2(0.0, 1.0));\n    vec3 c11 = getGridColor(i + vec2(1.0, 1.0));\n    \n    vec3 color = mix(\n        mix(c00, c10, u.x),\n        mix(c01, c11, u.x),\n        u.y\n    );\n    \n    gl_FragColor = vec4(color, 1.0);\n}\n";let theShader,themeVal=1,gridOptions=[[6,8],[12,16],[3,5]],currentGrid=2;function setup(){createCanvas(windowWidth,windowHeight,WEBGL),pixelDensity(1),theShader=createShader(vertShader,fragShader),document.getElementById("ctrl-theme").addEventListener("change",e=>{themeVal=parseFloat(e.target.value)}),document.getElementById("ctrl-grid").addEventListener("change",e=>{currentGrid=parseInt(e.target.value)})}function draw(){shader(theShader),theShader.setUniform("u_resolution",[width,height]),theShader.setUniform("u_time",millis()/1e3),theShader.setUniform("u_theme",themeVal),theShader.setUniform("u_gridSize",gridOptions[currentGrid]);let e=constrain(mouseX/width,0,1),n=constrain(mouseY/height,0,1);theShader.setUniform("u_mouse",[e,n]),rectMode(CENTER),rect(0,0,width,height)}function windowResized(){resizeCanvas(windowWidth,windowHeight)}</script></body></html>
