      }</script></head><body><div id="canvas-container"></div><div id="info-panel"><h1>07: DEPTH</h1><p>Iridescent Holographic 3D Typography. Drag on the screen to shift the prismatic chrome reflection.</p><div class="footer">Three.js + ShaderMaterial</div></div><script type="module">import*as THREE from"three";import{FontLoader}from"three/addons/loaders/FontLoader.js";import{TextGeometry}from"three/addons/geometries/TextGeometry.js";const VERT_SHADER="\n  varying vec3 vNormal;\n  varying vec3 vViewDir;\n  varying vec3 vPosition;\n  varying vec2 vUv;\n\n  void main() {\n    vec4 worldPos = modelMatrix * vec4(position, 1.0);\n    vec4 viewPos = viewMatrix * worldPos;\n\n    vNormal = normalize(normalMatrix * normal);\n    vViewDir = normalize(-viewPos.xyz);\n    vPosition = position;\n    vUv = uv;\n\n    gl_Position = projectionMatrix * viewPos;\n  }\n",FRAG_SHADER="\n  uniform float uTime;\n  uniform vec2 uLightDir;\n\n  varying vec3 vNormal;\n  varying vec3 vViewDir;\n  varying vec3 vPosition;\n  varying vec2 vUv;\n\n  vec3 hsv2rgb(vec3 c) {\n    vec4 K = vec4(1.0, 2.0 / 3.0, 1.0 / 3.0, 3.0);\n    vec3 p = abs(fract(c.xxx + K.xyz) * 6.0 - K.www);\n    return c.z * mix(K.xxx, clamp(p - K.xxx, 0.0, 1.0), c.y);\n  }\n\n  void main() {\n    vec3 lightDir = normalize(vec3(uLightDir.x, uLightDir.y, 1.0));\n    vec3 normal = normalize(vNormal);\n    vec3 viewDir = normalize(vViewDir);\n\n    float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 2.5);\n\n    vec3 halfVec = normalize(lightDir + viewDir);\n    float spec = pow(max(dot(normal, halfVec), 0.0), 64.0);\n\n    float reflection = dot(reflect(-viewDir, normal), lightDir);\n    reflection = clamp(reflection, 0.0, 1.0);\n\n    float hue = fract(\n      reflection * 1.2\n      + fresnel * 0.6\n      + uTime * 0.08\n      + vPosition.x * 0.04\n      + vPosition.y * 0.04\n    );\n\n    float saturation = 0.85 + fresnel * 0.15;\n    float brightness = 0.3 + spec * 0.9 + fresnel * 0.5 + reflection * 0.35;\n\n    vec3 iridescent = hsv2rgb(vec3(hue, saturation, min(brightness, 1.0)));\n\n    vec3 chromeDark = vec3(0.05, 0.05, 0.08);\n    // Lift minimum mix so front face shows some iridescent color (0.25 lift)\n    vec3 color = mix(chromeDark, iridescent, clamp(0.25 + fresnel + spec * 0.7 + reflection * 0.5, 0.0, 1.0));\n\n    float specHighlight = pow(spec, 3.0) * 0.8;\n    color += vec3(specHighlight);\n\n    gl_FragColor = vec4(color, 1.0);\n  }\n",container=document.getElementById("canvas-container"),renderer=new THREE.WebGLRenderer({antialias:!0,alpha:!1});renderer.setSize(container.clientWidth,container.clientHeight),renderer.setPixelRatio(Math.min(window.devicePixelRatio,2)),renderer.setClearColor(0,1),container.appendChild(renderer.domElement);const scene=new THREE.Scene;scene.background=new THREE.Color(0);const camera=new THREE.PerspectiveCamera(45,container.clientWidth/container.clientHeight,.1,1e3);camera.position.set(0,0,18),camera.lookAt(0,0,0);const uniforms={uTime:{value:0},uLightDir:{value:new THREE.Vector2(0,0)}},material=new THREE.ShaderMaterial({vertexShader:VERT_SHADER,fragmentShader:FRAG_SHADER,uniforms:uniforms,side:THREE.FrontSide});let textMesh=null,textGroup=null;const loader=new FontLoader;loader.load("https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",e=>{const n=new TextGeometry("DEPTH",{font:e,size:4,height:.7,curveSegments:20,bevelEnabled:!0,bevelThickness:.12,bevelSize:.06,bevelOffset:0,bevelSegments:10});n.computeBoundingBox();const t=n.boundingBox,o=(t.max.x-t.min.x)/2,i=(t.max.y-t.min.y)/2;n.translate(-o,-i,0),textMesh=new THREE.Mesh(n,material),textGroup=new THREE.Group,textGroup.add(textMesh),scene.add(textGroup)},void 0,e=>console.error("Font load error:",e));let isDragging=!1,lastX=0,lastY=0,rotX=0,rotY=0,velocityX=0,velocityY=0;const onMouseDown=e=>{isDragging=!0,lastX=e.clientX,lastY=e.clientY,velocityX=0,velocityY=0},onMouseMove=e=>{const n=container.clientWidth,t=container.clientHeight,o=e.clientX/n*2-1,i=-(e.clientY/t*2-1);if(uniforms.uLightDir.value.set(2.5*o,2.5*i),isDragging){const n=e.clientX-lastX,t=e.clientY-lastY;velocityX=.005*t,velocityY=.005*n,rotX+=velocityX,rotY+=velocityY,lastX=e.clientX,lastY=e.clientY,textGroup&&(textGroup.rotation.x=rotX,textGroup.rotation.y=rotY)}},onMouseUp=()=>{isDragging=!1},onTouchStart=e=>{const n=e.touches[0];isDragging=!0,lastX=n.clientX,lastY=n.clientY,velocityX=0,velocityY=0},onTouchMove=e=>{e.preventDefault();const n=e.touches[0],t=container.clientWidth,o=container.clientHeight,i=n.clientX/t*2-1,r=-(n.clientY/o*2-1);if(uniforms.uLightDir.value.set(2.5*i,2.5*r),isDragging){const e=n.clientX-lastX,t=n.clientY-lastY;velocityX=.005*t,velocityY=.005*e,rotX+=velocityX,rotY+=velocityY,lastX=n.clientX,lastY=n.clientY,textGroup&&(textGroup.rotation.x=rotX,textGroup.rotation.y=rotY)}},onTouchEnd=()=>{isDragging=!1};container.addEventListener("mousedown",onMouseDown),window.addEventListener("mousemove",onMouseMove),window.addEventListener("mouseup",onMouseUp),container.addEventListener("touchstart",onTouchStart,{passive:!1}),container.addEventListener("touchmove",onTouchMove,{passive:!1}),container.addEventListener("touchend",onTouchEnd);const handleResize=()=>{const e=container.clientWidth,n=container.clientHeight;camera.aspect=e/n,camera.updateProjectionMatrix(),renderer.setSize(e,n)};window.addEventListener("resize",handleResize);const clock=new THREE.Clock,animate=()=>{requestAnimationFrame(animate);const e=clock.getElapsedTime();uniforms.uTime.value=e,!isDragging&&textGroup&&(velocityX*=.95,velocityY*=.95,rotX+=velocityX,rotY+=velocityY,textGroup.rotation.x=rotX,textGroup.rotation.y=rotY),renderer.render(scene,camera)};animate()</script></body></html>
