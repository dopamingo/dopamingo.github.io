e="1">WEIMAR PRIMARY</option><option value="2">BERLIN GEOMETRY</option><option value="3">KANDINSKY CANVAS</option><option value="4">ALBERS STUDY</option></select></div></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script><script>const CONFIG={quantity:30,yOffset:240,xOffset:800,xFreq:500,yFreq:200,intensity:10,quality:5,loopSpeed:.05,seed:373},PALETTES=[{name:"BERLIN GEOMETRY",bg:"#2c2d31",colors:["#f0eadd","#d1bfae","#a63d2f","#3b5c66","#e0a969","#1a1a1c"]},{name:"DESSAU CLASSIC",bg:"#f4f0e6",colors:["#1d3b70","#c13127","#e1a533","#2b2b2b","#ffffff","#e8dfcc"]},{name:"WEIMAR PRIMARY",bg:"#ebd9c8",colors:["#d92525","#004481","#f2c300","#111111","#e05929","#ffffff"]},{name:"KANDINSKY CANVAS",bg:"#dfab54",colors:["#183a54","#a62f25","#595e42","#f7f4ea","#312c2a","#e2cca0"]},{name:"ALBERS STUDY",bg:"#b63c29",colors:["#dfcba0","#363533","#c88e36","#203148","#e8e2d2","#1a1c23"]}];let currentPalette,layerColors=[],timeOffset=0,targetMouseX=0,targetMouseY=0;function setup(){createCanvas(windowWidth,windowHeight);const e=document.getElementById("theme-select");e&&e.addEventListener("change",e=>{initWaves(parseInt(e.target.value))}),initWaves(0),targetMouseX=width/2,targetMouseY=height/2}function initWaves(e){currentPalette=PALETTES[e],document.body.style.backgroundColor=currentPalette.bg,randomSeed(CONFIG.seed+e),noiseSeed(CONFIG.seed),layerColors=[];for(let e=0;e<CONFIG.quantity;e++)layerColors.push(random(currentPalette.colors))}function draw(){background(currentPalette.bg),targetMouseX=lerp(targetMouseX,mouseX||width/2,.015),targetMouseY=lerp(targetMouseY,mouseY||height/2,.015);let e=map(targetMouseX,0,width,-200,200),t=CONFIG.yOffset*map(targetMouseY,0,height,.8,1.1);timeOffset+=.05*CONFIG.loopSpeed,noStroke();for(let a=0;a<CONFIG.quantity;a++){fill(layerColors[a]),beginShape(),vertex(0,height);let o=map(a,0,CONFIG.quantity-1,.4*height,height+100);for(let r=0;r<=width+CONFIG.quality;r+=CONFIG.quality){let n=noise((r+CONFIG.xOff
