cale Mapping\nvec3 getAcidColor(float t) {\n    // Base background color (Neon Orange/Red)\n    vec3 c0 = vec3(1.0, 0.2, 0.0); \n    \n    // Glowing aura palette\n    vec3 c1 = vec3(0.9, 0.0, 0.7); // Pink fade\n    vec3 c2 = vec3(0.0, 1.0, 0.8); // Cyan/Mint\n    vec3 c3 = vec3(1.0, 1.0, 0.0); // Bright Yellow edge\n    vec3 c4 = vec3(1.0, 1.0, 1.0); // Pure White Inner Glow\n    vec3 c5 = vec3(0.0, 0.0, 0.0); // Core Text: Pure Black\n    \n    float t2 = clamp(t, 0.0, 1.0);\n    \n    if (t2 < 0.1)  return mix(c0, c1, smoothstep(0.0, 0.1, t2));\n    if (t2 < 0.3)  return mix(c1, c2, smoothstep(0.1, 0.3, t2));\n    if (t2 < 0.6)  return mix(c2, c3, smoothstep(0.3, 0.6, t2));\n    if (t2 < 0.85) return mix(c3, c4, smoothstep(0.6, 0.85, t2));\n    return mix(c4, c5, smoothstep(0.85, 1.0, t2));\n}\n\nvoid main() {\n    vec2 uv = vTexCoord; // Screen output uv \n    \n    // Chromatic Aberration RGB spread scale based on output UV\n    float offset = 0.003;\n    \n    float vR = texture2D(u_tex, uv + vec2(offset, 0.0)).r;\n    float vG = texture2D(u_tex, uv).r;\n    float vB = texture2D(u_tex, uv - vec2(offset, 0.0)).r;\n    \n    vec3 colR = getAcidColor(vR);\n    vec3 colG = getAcidColor(vG);\n    vec3 colB = getAcidColor(vB);\n    \n    // Assemble RGB color channels\n    vec3 finalColor = vec3(colR.r, colG.g, colB.b);\n    \n    gl_FragColor = vec4(finalColor, 1.0);\n}\n";let textFbo,fb1,fb2,pass1,pass2;function setup(){createCanvas(windowWidth,windowHeight,WEBGL),pixelDensity(1),textFbo=createGraphics(windowWidth,windowHeight),fb1=createFramebuffer(),fb2=createFramebuffer(),pass1=createShader(vertShader,fragFeedback),pass2=createShader(vertShader,fragOutput)}function draw(){drawTextFbo(),fb1.begin(),clear(),shader(pass1),pass1.setUniform("u_text",textFbo),pass1.setUniform("u_feedback",fb2),pass1.setUniform("u_time",millis()/1e3),pass1.setUniform("u_mouse",[mouseX/width,mouseY/height]),pass1.setUniform("u_resolution",[width,height]),rectMode(CENTER),rect(0,0,widt
