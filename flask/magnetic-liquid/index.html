        void main() {

        float snoise(vec2 v){
          const vec4 C = vec4(0.211324865405187, 0.366025403784439,
                   -0.577350269189626, 0.024390243902439);

          i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);

          m = m*m ;

          vec3 h = abs(x) - 0.5;
          vec3 a0 = x - floor(x + 0.5);
          vec3 g = a0 * vec3(x0.x,x12.xz,x12.w) + h * vec3(x0.y,x12.yw,x12.z);
          vec3 l = 1.79284291400159 - 0.85373472095314 * ( g*g + h*h );
          vec3 vec = 130.0 * m * ( 1.79284291400159 - 0.85373472095314 * ( g*g + h*h ) * (g * vec3(x0.x,x12.xz,x12.w) + h * vec3(x0.y,x12.yw,x12.z)));
          return 130.0 * dot(m, g);

        void main() {
            vec2 uv = gl_FragCoord.xy / u_resolution.xy;
            vec2 center = u_mouse / u_resolution.xy;
            
            // Distort UV based on mouse distance
