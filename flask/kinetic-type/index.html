}@media (max-width:900px){#info-panel{display:none}#control-panel{top:auto;bottom:30px;right:50%;transform:translateX(50%);width:300px}}</style></head><body><div id="info-panel"><h1>Sliced Kinetic Typo</h1><p>Interactive typography<br>built with Shaders.</p><p>Text glitches horizontally<br>reacting to the cursor.</p><div class="footer">p5.js + WebGL</div></div><div id="control-panel"><input type="text" id="ipt-text" value="SLICE" maxlength="6"><div class="control-row"><label>Slice</label> <select id="ctrl-dir"><option value="0" selected="selected">HORIZONTAL</option><option value="1">VERTICAL</option></select></div><div class="control-row"><label>Color</label> <select id="ctrl-color"><option value="#000000" selected="selected">BLACK</option><option value="#f70000">RED</option><option value="#033dc9">BLUE</option></select></div></div><script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script><script>const vertShader="\nattribute vec3 aPosition;\nattribute vec2 aTexCoord;\n\nuniform mat4 uProjectionMatrix;\nuniform mat4 uModelViewMatrix;\n\nvarying vec2 vTexCoord;\n\nvoid main() {\n    vTexCoord = aTexCoord;\n    gl_Position = uProjectionMatrix * uModelViewMatrix * vec4(aPosition, 1.0);\n}\n",fragShader="\n#ifdef GL_ES\nprecision highp float;\n#endif\n\nvarying vec2 vTexCoord;\n\nuniform sampler2D u_tex;\nuniform float u_time;\nuniform vec2 u_mouse;\nuniform float u_dir;\n\nvoid main() {\n    vec2 uv = vTexCoord;\n    // Removed p5.js WebGL invert to fix upside-down S\n    \n    // Configurable slice values to match the reference (horizontal layered segments)\n    float numSlices = 14.0;\n    \n    // Base interaction intensity based on mouse distance\n    float interact = u_mouse.x * 2.0; \n    \n    vec2 movedUv = uv;\n    \n    if (u_dir < 0.5) {\n        // HORIZONTAL SLICE: stacked vertically, moving left/right\n        float segmentY = floor(uv.y * numSlices) / numSlices;\n        float distFromCenterY = abs(segmentY - 0.5);\n        float shift = sin(distFromCenterY * 8.0 - u_time * 2.5) * (0.025 * interact);\n        movedUv.x += shift;\n    } else {\n        // VERTICAL SLICE: stacked horizontally, moving up/down. \n        // Tripling the slice count for a much tighter, narrower glitch\n        float vertSlices = numSlices * 1.5; \n        float segmentX = floor(uv.x * vertSlices) / vertSlices;\n        float distFromCenterX = abs(segmentX - 0.5);\n        float shift = sin(distFromCenterX * 8.0 - u_time * 2.5) * (0.025 * interact);\n        movedUv.y += shift;\n    }\n    \n    // Sample the color from the hidden text FBO\n    vec4 color = texture2D(u_tex, movedUv);\n    \n    if(color.a < 0.05) discard;\n    \n    gl_FragColor = color;\n}\n";let textFbo,myShader;const settings={text:"SLICE",bgColor:"#000000",dir:0};function setup(){createCanvas(windowWidth,windowHeight,WEBGL),pixelDensity(1),frameRate(60),textFbo=createGraphics(windowWidth,windowHeight),myShader=createShader(vertShader,fragShader),document.getElementById("ipt-text").addEventListener("input",e=>{settings.text=e.target.value.toUpperCase()}),document.getElementById("ctrl-dir").addEventListener("change",e=>{settings.dir=parseFloat(e.target.value)}),document.getElementById("ctrl-color").addEventListener("change",e=>{settings.bgColor=e.target.value})}function draw(){background(settings.bgColor),drawCoreText();let e=dist(mouseX,mouseY,width/2,height/2),t=0;e<.4*min(width,height)&&(t=map(e,0,.4*min(width,height),1,0,!0)),shader(myShader),myShader.setUniform("u_tex",textFbo),myShader.setUniform("u_time",millis()/1e3),myShader.setUniform("u_mouse",[t,0]),myShader.setUniform("u_dir",settings.dir),rectMode(CENTER),rect(0,0,width,height)}function windowResized(){resizeCanvas(windowWidth,windowHeight),textFbo.resizeCanvas(windowWidth,windowHeight)}function drawCoreText(){textFbo.clear(),textFbo.push(),textFbo.translate(width/2,height/2),textFbo.textAlign(CENTER,CENTER),textFbo.textBaseline="middle",textFbo.textFont("Helvetica, Arial, sans-
